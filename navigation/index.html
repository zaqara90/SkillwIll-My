<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კვადრატული ფოტო</title>
    <style>
        /* კვადრატული კონტეინერი */
        .square-box {
            width: 300px;         /* კვადრატის სიგანე */
            height: 300px;        /* კვადრატის სიმაღლე */
            border: 2px solid #333; /* ჩარჩოს ფერი და სისქე (არჩევითია) */
            overflow: hidden;     /* ზედმეტი ნაწილების ჩამოჭრა */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;   /* კუთხეების მომრგვალება (არჩევითია) */
        }

        /* ფოტოს სტილი */
        .square-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;    /* ფოტო ავსებს კვადრატს პროპორციების დარღვევის გარეშე */
        }
    </style>
</head>
<body>

    <!-- კვადრატული ბლოკი ფოტოთი -->
    <div class="square-box">
        <img src="შენი_ფოტოს_ბმული_ან_სახელი.jpg" alt="ფოტოს აღწერა">
    </div>

</body>
</html>
